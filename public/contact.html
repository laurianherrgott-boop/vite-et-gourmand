<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact — Vite &amp; Gourmand</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <header>
    <a href="/">Vite &amp; Gourmand</a>
    <nav aria-label="Menu principal">
      <a href="/">Accueil</a>
      <a href="/menus.html">Menus</a>
      <a href="/contact.html">Contact</a>
      <a href="/connexion.html">Connexion</a>
    </nav>
  </header>

  <main>
    <h1>Demander un devis</h1>

    <form class="formulaire" action="/contact" method="post">
      <label for="nom">Nom</label>
      <input type="text" id="nom" name="nom" required>

      <label for="email">Email</label>
      <input type="email" id="email" name="email" required>

      <label for="date">Date de l'événement</label>
      <input type="date" id="date" name="date" required>

      <label for="personnes">Nombre de personnes</label>
      <input type="number" id="personnes" name="personnes" min="1" required>

      <label for="message">Votre message</label>
      <textarea id="message" name="message" rows="5"></textarea>

      <button type="submit" class="bouton">Envoyer ma demande</button>
    </form>
  </main>

  <footer>
    <p>Horaires : à venir</p>
    <a href="/mentions-legales.html">Mentions légales</a>
    <a href="/cgv.html">Conditions générales de vente</a>
  </footer>
</body>
</html>
